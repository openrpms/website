url: "https://openrpms.org"
baseurl: ""

title: "OpenRPMS"

description: "RPMS, built in the open: the people who use it, a working server built from the public FOIA files and the RPCs it answers, and the applications built on it."

# Header icon and footer. The organization, where the work lives.
github_url: "https://github.com/openrpms"

author:
  name: "OpenRPMS contributors"
  url: "https://openrpms.org"

keywords: "OpenRPMS, open source healthcare, Indian Health Service, IHS, RPMS, EHR, Electronic Health Record, Resource and Patient Management System, clinical workflows, open healthcare, tribal health"

# The companion that keeps the full personas, user stories and journeys (rpms-ux).
# Leave empty until it is public; once set, /users and the workflow pages link to it.
companion_url: ""

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-datapage-generator

page_gen:
  - data: packages
    template: package
    name: namespace
    dir: packages
    title: name
  - data: workflows
    template: workflow
    name: id
    dir: workflows
    title: name

exclude:
  - docs
  - package.json
  - package-lock.json
  - postcss.config.js
  - tailwind.config.js
  - node_modules
  - Gemfile
  - Gemfile.lock
  - PLAN.md
  - STRATEGY.md
  - DESIGN_PROMPT.md
  - DOMAIN_DDD_summary.md
  - WORKFLOW_GUIDANCE.md
  - product-cycle
  - scripts
